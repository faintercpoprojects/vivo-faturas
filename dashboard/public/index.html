<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Contas a Pagar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2311161d'/><path d='M9 16.5l4.5 4.5L23 11.5' stroke='%237aa2ff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<style>
  :root{
    --bg:#0d1014; --surface:#141920; --surface-2:#1a2029; --line:#232b36; --line-2:#2c3542;
    --text:#e7ebf1; --muted:#8c96a5; --faint:#5f6876;
    --accent:#7aa2ff; --accent-ink:#0b1220;
    --red:#ff7a72; --red-bg:rgba(255,122,114,.12);
    --amber:#f2c063; --amber-bg:rgba(242,192,99,.12);
    --green:#5fd39a; --green-bg:rgba(95,211,154,.12);
    --blue-bg:rgba(122,162,255,.12);
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- topo ---------- */
  header{position:sticky;top:0;z-index:5;background:rgba(13,16,20,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topo{max-width:1320px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em}
  .marca i{width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center}
  .status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .status.rodando .dot{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
  .status.erro .dot{background:var(--red)}
  @keyframes pulse{50%{opacity:.25}}
  .espaco{flex:1}

  button,.btn{font:inherit;font-size:13px;font-weight:550;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
  button:hover,.btn:hover{border-color:#3a4555;background:var(--surface-2);text-decoration:none}
  button:disabled{opacity:.45;cursor:default}
  .primario{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .primario:hover{background:#93b4ff;border-color:#93b4ff}
  .fantasma{background:transparent;border-color:transparent;color:var(--muted)}
  .fantasma:hover{color:var(--text);background:var(--surface)}
  svg.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

  main{max-width:1320px;margin:0 auto;padding:24px}

  /* ---------- indicadores ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.35fr);gap:12px;margin-bottom:22px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
  .kpi .rot{font-size:12px;color:var(--muted)}
  .kpi .val{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:6px}
  .kpi .sub{font-size:12px;color:var(--faint);margin-top:2px}
  .kpi.red .val{color:var(--red)} .kpi.amber .val{color:var(--amber)} .kpi.green .val{color:var(--green)}
  .prox{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .prox div{display:flex;gap:10px;font-size:12.5px;align-items:baseline;min-width:0}
  .prox .d{color:var(--muted);width:42px;flex:none}
  .prox .e{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .prox .v{font-weight:600}

  /* ---------- filtros ---------- */
  .filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input,select,textarea{font:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 11px}
  select{padding-right:8px;max-width:220px}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  .busca{position:relative;flex:1 1 260px;max-width:360px}
  .busca input{width:100%;padding-left:32px}
  .busca svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .contador{font-size:12.5px;color:var(--faint);margin-left:auto}

  /* ---------- tabela ---------- */
  .tabela{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:920px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
  th{font-size:11.5px;font-weight:550;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;background:var(--surface)}
  th:hover{color:var(--muted)}
  th.ord::after{content:" ↑";color:var(--accent)} th.ord.desc::after{content:" ↓"}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#171d25}
  td.r,th.r{text-align:right}
  .emp{max-width:300px;white-space:normal}
  .emp b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .emp span{font-size:12px;color:var(--faint)}
  .valor{font-weight:600}
  .vazio{padding:56px 20px;text-align:center;color:var(--faint)}

  .sit{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:550;padding:3px 10px 3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
  .sit::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .sit.vencida{color:var(--red);background:var(--red-bg)}
  .sit.avencer{color:var(--amber);background:var(--amber-bg)}
  .sit.paga{color:var(--green);background:var(--green-bg)}
  .sit.baixa{color:var(--accent);background:var(--blue-bg)}
  .op{font-size:12.5px;color:var(--muted)}

  .docs{display:flex;gap:4px}
  .chip{font-size:12px;font-weight:550;color:var(--muted);background:transparent;border:1px solid var(--line-2);border-radius:7px;padding:3px 8px}
  .chip:hover{color:var(--text);border-color:#3a4555;text-decoration:none;background:var(--surface-2)}
  .interno{font-size:12.5px;color:var(--muted)}
  .interno b{color:var(--green);font-weight:550}
  .acoes{display:flex;gap:4px;justify-content:flex-end}
  .icone{padding:6px;border-color:transparent;background:transparent;color:var(--faint)}
  .icone:hover{color:var(--text);background:var(--surface-2);border-color:var(--line-2)}
  .icone.perigo:hover{color:var(--red);background:var(--red-bg);border-color:transparent}

  /* ---------- diálogos ---------- */
  dialog{border:1px solid var(--line-2);border-radius:16px;padding:0;width:min(460px,calc(100vw - 32px));background:var(--surface);color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
  dialog .hd{padding:18px 20px 4px;font-weight:600;font-size:15px}
  dialog .sub{padding:0 20px;font-size:12.5px;color:var(--muted)}
  dialog .bd{padding:16px 20px;display:grid;gap:12px}
  dialog label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
  dialog input,dialog select,dialog textarea{width:100%;background:var(--bg)}
  dialog .row{display:flex;gap:10px}
  dialog .row>*{flex:1;min-width:0}
  dialog .ft{padding:14px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}

  @media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpis .lista{grid-column:1/-1} }
  @media (max-width:640px){
    .topo,main{padding-left:16px;padding-right:16px}
    .kpi .val{font-size:20px}
    .busca{max-width:none}
    .contador{width:100%;margin-left:0}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-pasta" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-lixo" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-sair" viewBox="0 0 24 24"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></symbol>
</svg>

<header>
  <div class="topo">
    <div class="marca"><i><svg class="ic" style="color:var(--accent)"><use href="#i-check"/></svg></i>Contas a Pagar</div>
    <span class="status" id="statusBox"><span class="dot"></span><span id="status">carregando…</span></span>
    <div class="espaco"></div>
    <a class="btn fantasma" id="btnDrive" href="#" target="_blank" rel="noopener"><svg class="ic"><use href="#i-pasta"/></svg>Drive</a>
    <button id="btnStatus" title="Só lê Paga/Pendente/Atrasada nos portais — rápido, sem baixar boletos"><svg class="ic"><use href="#i-sync"/></svg>Atualizar status</button>
    <button class="primario" id="btnRun" title="Baixa faturas e boletos dos portais (Vivo, Desktop, AONet, Vero)"><svg class="ic"><use href="#i-down"/></svg>Baixar contas</button>
    <button class="fantasma hidden" id="btnSair" title="Sair" style="display:none"><svg class="ic"><use href="#i-sair"/></svg></button>
  </div>
</header>

<main>
  <section class="kpis" id="cards"></section>

  <div class="filtros">
    <label class="busca"><svg class="ic"><use href="#i-busca"/></svg><input type="search" id="busca" placeholder="Buscar empresa, linha, nº da fatura…" aria-label="Buscar" /></label>
    <select id="fSituacao" aria-label="Situação"><option value="">Situação</option></select>
    <select id="fProduto" aria-label="Operadora"><option value="">Operadora</option><option value="Movel">Vivo Móvel</option><option value="Fixo">Vivo Fixo</option><option value="Desktop">Desktop</option><option value="AONet">AONet</option><option value="Vero">Vero</option></select>
    <select id="fCompetencia" aria-label="Competência"><option value="">Competência</option></select>
    <select id="fEmpresa" aria-label="Empresa"><option value="">Empresa</option></select>
    <select id="fCnpj" aria-label="CNPJ"><option value="">CNPJ</option></select>
    <button id="btnAdd" title="Cadastrar uma nota manualmente"><svg class="ic"><use href="#i-mais"/></svg>Nova nota</button>
    <span class="contador num" id="contador"></span>
  </div>

  <div class="tabela">
    <table id="tabela">
      <thead><tr>
        <th data-k="situacao">Situação</th>
        <th data-k="data_vencimento">Vencimento</th>
        <th data-k="empresa">Empresa</th>
        <th data-k="produto">Operadora</th>
        <th data-k="valor_original" class="r">Valor</th>
        <th style="cursor:default">Documentos</th>
        <th data-k="status_interno">Financeiro</th>
        <th style="cursor:default"></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <div class="hd">Registrar pagamento</div>
    <div class="sub" id="dlgTitulo"></div>
    <div class="bd">
      <div><label>Situação interna</label>
        <select name="status_interno">
          <option>Em aberto</option><option>Paga</option><option>Baixada</option>
          <option>Paga e Baixada</option><option>Necessita conferência</option>
        </select></div>
      <div class="row">
        <div><label>Valor pago (R$)</label><input name="valor_pago" type="number" step="0.01" /></div>
        <div><label>Data do pagamento</label><input name="data_pagamento" type="date" /></div>
      </div>
      <div class="row">
        <div><label>Data da baixa</label><input name="data_baixa" type="date" /></div>
        <div><label>Forma de pagamento</label>
          <select name="forma_pagamento"><option value=""></option><option>PIX</option><option>Boleto</option><option>Transferência</option><option>Cartão</option><option>Débito automático</option></select></div>
      </div>
      <div><label>Comprovante</label><input name="comprovante" placeholder="ex.: comprovante_pix.pdf ou link" /></div>
      <div><label>Observações</label><textarea name="observacoes" rows="2"></textarea></div>
    </div>
    <div class="ft">
      <button type="button" class="fantasma" id="dlgCancel">Cancelar</button>
      <button type="submit" class="primario">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgAdd">
  <form method="dialog" id="frmAdd">
    <div class="hd">Nova nota</div>
    <div class="sub">Lançamento manual, fora dos portais.</div>
    <div class="bd">
      <div class="row">
        <div style="flex:2"><label>Empresa</label><input name="empresa" placeholder="Nome da empresa" /></div>
        <div><label>Operadora</label><select name="produto"><option value="Movel">Vivo Móvel</option><option value="Fixo">Vivo Fixo</option><option value="Desktop">Desktop</option><option value="AONet">AONet</option><option value="Vero">Vero</option></select></div>
      </div>
      <div><label>CNPJ</label><input name="cnpj" placeholder="00.000.000/0000-00" /></div>
      <div class="row">
        <div><label>Vencimento</label><input name="data_vencimento" type="date" /></div>
        <div><label>Valor (R$)</label><input name="valor_original" type="number" step="0.01" placeholder="0,00" /></div>
      </div>
      <div class="row">
        <div><label>Linha / contrato</label><input name="linha" placeholder="opcional" /></div>
        <div><label>Nº do documento</label><input name="numero_documento" placeholder="opcional" /></div>
      </div>
      <div><label>Observações</label><textarea name="observacoes" rows="2"></textarea></div>
    </div>
    <div class="ft">
      <button type="button" class="fantasma" id="dlgAddCancel">Cancelar</button>
      <button type="submit" class="primario">Cadastrar</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s,e=document)=>e.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => v==null ? '—' : 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dBR = s => { if(!s) return '—'; const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:s; };
const dCurta = s => { const m=String(s||'').match(/\d{4}-(\d{2})-(\d{2})/); return m?`${m[2]}/${m[1]}`:'—'; };
let CONTAS=[], SORT={k:'auto',dir:1}; // auto = vencidas, a vencer, depois pagas

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

function opNome(p){
  if(/^(desktop|aonet|vero)$/i.test(p||'')) return p;
  if(/fixo/i.test(p||'')) return 'Vivo Fixo';
  if(/mov/i.test(p||'')) return 'Vivo Móvel';
  return p||'—';
}
function tag(s){
  const t=(s||'').toLowerCase();
  const cls = t.includes('vencida')?'vencida':t.includes('vencer')?'avencer':t.includes('baix')?'baixa':t.includes('pag')?'paga':'';
  return `<span class="sit ${cls}">${esc(s||'—')}</span>`;
}

async function carregar(){
  const [resumo, contas] = await Promise.all([
    fetch('/api/resumo').then(r=>r.json()),
    fetch('/api/contas').then(r=>r.json()),
  ]);
  CONTAS = contas;
  renderResumo(resumo);
  preencherFiltros();
  render();
  const st = await fetch('/api/run/status').then(r=>r.json()).catch(()=>({}));
  const box=$('#statusBox'); box.className='status';
  $('#status').textContent = st.ultima ? `Atualizado em ${new Date(st.ultima.fim).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}` : 'Sem coleta registrada';
  if(st.resultado && !st.resultado.ok){ box.classList.add('erro'); $('#status').textContent += ' · última sincronização falhou'; box.title='Veja logs/dashboard-sync.log'; }
  $('#btnRun').disabled = !!st.rodando; $('#btnStatus').disabled = !!st.rodando;
  if(st.rodando){
    const min = st.inicio ? Math.floor((Date.now()-new Date(st.inicio))/60000) : 0;
    box.className='status rodando';
    $('#status').textContent = (st.modo==='status' ? 'Atualizando status nos portais' : 'Baixando contas dos portais') + (min ? ` · ${min} min` : '…');
    setTimeout(carregar, 5000);
  }
}

function renderResumo(r){
  const k=(rot,val,sub,cls='')=>`<div class="kpi ${cls}"><div class="rot">${rot}</div><div class="val num">${val}</div><div class="sub num">${sub}</div></div>`;
  $('#cards').innerHTML =
      k('Em aberto', money(r.valorPendente), `${r.emAberto} conta(s)`)
    + k('Vencidas', money(r.valorVencido), `${r.vencidas} conta(s)`, r.vencidas?'red':'')
    + k('A vencer', money(r.valorAVencer), `${r.aVencer} conta(s)`, r.aVencer?'amber':'')
    + k('Pagas', r.pagas, `de ${r.total} conta(s)`, 'green')
    + `<div class="kpi lista"><div class="rot">Próximos vencimentos</div><div class="prox">`
    + (r.proximosVencimentos.length
        ? r.proximosVencimentos.map(p=>`<div><span class="d num">${dCurta(p.vencimento)}</span><span class="e">${esc(p.empresa||p.linha||'')}</span><span class="v num">${money(p.valor)}</span></div>`).join('')
        : '<div class="faint">Nenhum vencimento em aberto</div>')
    + `</div></div>`;
}

function preencherFiltros(){
  const comp=[...new Set(CONTAS.map(c=>c.competencia).filter(Boolean))].sort((a,b)=>{const f=s=>s.split('/').reverse().join('');return f(b).localeCompare(f(a));});
  const emp=[...new Set(CONTAS.map(c=>c.empresa).filter(Boolean))].sort();
  const sit=[...new Set(CONTAS.map(c=>c.situacao).filter(Boolean))].sort();
  const cnpj=[...new Set(CONTAS.map(c=>c.cnpj).filter(Boolean))].sort();
  const fill=(sel,arr)=>{const cur=sel.value; sel.innerHTML=sel.options[0].outerHTML+arr.map(x=>`<option>${esc(x)}</option>`).join(''); sel.value=cur;};
  fill($('#fCompetencia'),comp); fill($('#fEmpresa'),emp); fill($('#fSituacao'),sit); fill($('#fCnpj'),cnpj);
}

function filtradas(){
  const q=$('#busca').value.trim().toLowerCase();
  const fs=$('#fSituacao').value, fc=$('#fCompetencia').value, fe=$('#fEmpresa').value;
  const fj=$('#fCnpj').value, fp=$('#fProduto').value;
  let rows = CONTAS.filter(c=>{
    if(fs && c.situacao!==fs) return false;
    if(fc && c.competencia!==fc) return false;
    if(fe && c.empresa!==fe) return false;
    if(fj && c.cnpj!==fj) return false;
    if(fp==='Fixo' && !/fixo/i.test(c.produto||'')) return false;
    if(fp==='Movel' && !/mov/i.test(c.produto||'')) return false;
    if(fp && !['Fixo','Movel'].includes(fp) && c.produto!==fp) return false;
    if(q){ const hay=[c.empresa,c.numero_documento,c.linha,c.cnpj,opNome(c.produto)].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const {k,dir}=SORT;
  if(k==='auto'){
    // Em aberto primeiro (vencidas, depois a vencer, por vencimento); pagas por último (mais recentes antes).
    const peso=c=>{const t=(c.situacao||'').toLowerCase(); return t.includes('vencida')?0:t.includes('vencer')?1:2;};
    rows.sort((a,b)=>peso(a)-peso(b) || (peso(a)<2 ? String(a.data_vencimento||'9').localeCompare(String(b.data_vencimento||'9')) : String(b.data_vencimento||'').localeCompare(String(a.data_vencimento||''))));
    return rows;
  }
  rows.sort((a,b)=>{ let x=a[k]??'',y=b[k]??''; if(k==='valor_original'){x=+x||0;y=+y||0;} return (x>y?1:x<y?-1:0)*dir; });
  return rows;
}

// Documentos: fatura e boleto em PDF quando houver; senão, copiar código / Pix.
function docsCel(c){
  const out=[];
  if(c.pdf_baixado) out.push(`<a class="chip" href="/api/contas/${c.id}/fatura" target="_blank">Fatura</a>`);
  if(c.boleto_pdf_path||c.boleto_drive_link||(c.boleto_disponivel&&!c.linha_digitavel)) out.push(`<a class="chip" href="/api/contas/${c.id}/boleto" target="_blank">Boleto</a>`);
  if(c.linha_digitavel) out.push(`<button class="chip" title="Copiar linha digitável" onclick="copiar(${c.id},'linha_digitavel')">Código</button>`);
  if(c.pix_code) out.push(`<button class="chip" title="Copiar Pix copia e cola" onclick="copiar(${c.id},'pix_code')">Pix</button>`);
  return out.length?`<div class="docs">${out.join('')}</div>`:'<span class="faint">—</span>';
}
window.copiar=async(id,campo)=>{
  const v=(CONTAS.find(x=>x.id===id)||{})[campo]; if(!v) return;
  try{ await navigator.clipboard.writeText(v); }
  catch{ const t=document.createElement('textarea'); t.value=v; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(campo==='pix_code'?'Pix copia e cola copiado':'Linha digitável copiada');
};

function render(){
  const rows=filtradas();
  $('#contador').textContent = `${rows.length} de ${CONTAS.length} contas`;
  document.querySelectorAll('th[data-k]').forEach(th=>{ th.classList.toggle('ord',th.dataset.k===SORT.k); th.classList.toggle('desc',th.dataset.k===SORT.k&&SORT.dir<0); });
  if(!rows.length){ $('#tbody').innerHTML=`<tr><td colspan="8" class="vazio">Nenhuma conta encontrada.</td></tr>`; return; }
  $('#tbody').innerHTML = rows.map(c=>{
    const det=[c.cnpj, c.linha&&c.linha!==c.empresa?`linha ${c.linha}`:null, c.numero_documento?`nº ${c.numero_documento}`:null, c.competencia?`comp. ${c.competencia}`:null].filter(Boolean).map(esc).join(' · ');
    const pago=/pag|baix/i.test(c.status_interno||'');
    return `<tr>
      <td>${tag(c.situacao)}</td>
      <td class="num">${dBR(c.data_vencimento)}</td>
      <td class="emp"><b title="${esc(c.empresa||'')}">${esc(c.empresa||'—')}</b><span>${det}</span></td>
      <td class="op">${esc(opNome(c.produto))}</td>
      <td class="r num valor">${money(c.valor_original)}</td>
      <td>${docsCel(c)}</td>
      <td class="interno">${pago?`<b>${esc(c.status_interno)}</b>`:esc(c.status_interno||'Em aberto')}${c.valor_pago?` <span class="faint num">· ${money(c.valor_pago)}</span>`:''}</td>
      <td><div class="acoes">
        <button class="icone" title="Registrar pagamento" onclick="abrirModal(${c.id})"><svg class="ic"><use href="#i-check"/></svg></button>
        <button class="icone perigo" title="Excluir do dashboard" onclick="excluirConta(${c.id})"><svg class="ic"><use href="#i-lixo"/></svg></button>
      </div></td>
    </tr>`;
  }).join('');
}

// ordenação por coluna
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; SORT.dir = SORT.k===k? -SORT.dir : 1; SORT.k=k; render();
});
['#busca','#fSituacao','#fCompetencia','#fEmpresa','#fCnpj','#fProduto'].forEach(s=>$(s).addEventListener('input',render));

// modal de pagamento/baixa
let editId=null;
window.abrirModal=(id)=>{
  const c=CONTAS.find(x=>x.id===id); editId=id;
  $('#dlgTitulo').textContent = [c.empresa, opNome(c.produto), c.data_vencimento?`venc. ${dBR(c.data_vencimento)}`:null, money(c.valor_original)].filter(Boolean).join(' · ');
  const f=$('#frm');
  f.status_interno.value=c.status_interno||'Em aberto';
  f.valor_pago.value=c.valor_pago??''; f.data_pagamento.value=c.data_pagamento||'';
  f.data_baixa.value=c.data_baixa||''; f.forma_pagamento.value=c.forma_pagamento||'';
  f.comprovante.value=c.comprovante||''; f.observacoes.value=c.observacoes||'';
  $('#dlg').showModal();
};
$('#dlgCancel').onclick=()=>$('#dlg').close();
$('#frm').addEventListener('submit', async (e)=>{
  const f=e.target, body={};
  for(const k of ['status_interno','valor_pago','data_pagamento','data_baixa','forma_pagamento','comprovante','observacoes']){
    let v=f[k].value; if(v==='') v=null; if(k==='valor_pago'&&v!=null) v=Number(v); body[k]=v;
  }
  const r=await fetch(`/api/contas/${editId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  const i=CONTAS.findIndex(x=>x.id===editId); if(i>=0) CONTAS[i]=r;
  $('#dlg').close(); renderResumo(await fetch('/api/resumo').then(r=>r.json())); render(); toast('Pagamento registrado');
});

// excluir conta (lixeira)
window.excluirConta=async(id)=>{
  const c=CONTAS.find(x=>x.id===id);
  if(!confirm(`Excluir esta conta do dashboard?\n${c?`${c.empresa||''} · ${dBR(c.data_vencimento)} · ${money(c.valor_original)}`:''}`)) return;
  const r=await fetch(`/api/contas/${id}`,{method:'DELETE'}).then(r=>r.json()).catch(()=>({}));
  if(r&&r.ok){ CONTAS=CONTAS.filter(x=>x.id!==id); renderResumo(await fetch('/api/resumo').then(r=>r.json())); preencherFiltros(); render(); toast('Conta excluída'); }
  else toast('Não foi possível excluir');
};

// cadastrar nota manual
$('#btnAdd').onclick=()=>{ $('#frmAdd').reset(); $('#dlgAdd').showModal(); };
$('#dlgAddCancel').onclick=()=>$('#dlgAdd').close();
$('#frmAdd').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const f=e.target, body={};
  for(const k of ['empresa','cnpj','produto','data_vencimento','valor_original','linha','numero_documento','observacoes']){
    let v=f[k].value.trim(); if(v==='') v=null; if(k==='valor_original'&&v!=null) v=Number(v); body[k]=v;
  }
  if(!body.empresa && !body.cnpj){ toast('Informe ao menos a empresa ou o CNPJ'); return; }
  const r=await fetch('/api/contas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  if(r&&r.id){ CONTAS.push(r); renderResumo(await fetch('/api/resumo').then(r=>r.json())); preencherFiltros(); render(); $('#dlgAdd').close(); toast('Nota cadastrada'); }
  else toast('Não foi possível cadastrar: '+((r&&r.erro)||'erro'));
});

$('#btnRun').onclick=async()=>{
  if(!confirm('Baixar as contas dos portais agora (Vivo, Desktop, AONet, Vero)? Leva alguns minutos.')) return;
  $('#btnRun').disabled=true; $('#btnStatus').disabled=true; $('#status').textContent='Iniciando…';
  await fetch('/api/run',{method:'POST'}); setTimeout(carregar,3000);
};

$('#btnStatus').onclick=async()=>{
  if(!confirm('Atualizar o status das contas nos portais?\n(Rápido: só lê Paga/Pendente/Atrasada, sem baixar boletos.)')) return;
  $('#btnStatus').disabled=true; $('#btnRun').disabled=true; $('#status').textContent='Iniciando…';
  await fetch('/api/run?modo=status',{method:'POST'}); setTimeout(carregar,3000);
};

// link da pasta do Google Drive (configurável no servidor)
fetch('/api/config').then(r=>r.json()).then(cfg=>{
  const b=$('#btnDrive');
  if(cfg.driveFolderUrl){ b.href=cfg.driveFolderUrl; }
  else { b.style.display='none'; }
}).catch(()=>{});

carregar();
setInterval(carregar, 60000); // atualiza a cada minuto
</script>
</body>
</html>
